# ════════════════════════════════════════════════════════════════
# MES360° — Grafana datasource provisioning
# Auto-loaded on Grafana boot. Stable UIDs are referenced by every
# provisioned dashboard panel, so they MUST NOT change.
#
# Credentials/hosts come from MES_* environment variables set on the grafana
# container (see each docker-compose). Grafana expands $VAR / ${VAR} in provisioning
# files (shell-style ${VAR:-default} is NOT supported, so each MES_* var MUST be set).
# This keeps the file identical across dev and prod while letting each environment
# inject its own secrets (e.g. Hostinger's strong POSTGRES_PASSWORD / INFLUX_TOKEN).
# ════════════════════════════════════════════════════════════════
apiVersion: 1

# Allow re-provisioning to delete datasources that were removed here.
deleteDatasources:
  - name: MES360° PostgreSQL
    orgId: 1

datasources:
  # ── System of record (MES relational data) ─────────────────────
  - name: MES360° PostgreSQL
    uid: mes_postgres
    type: postgres
    access: proxy
    url: $MES_PG_HOST:$MES_PG_PORT
    # Root-level `database` was deprecated in Grafana 11+; the Postgres plugin now
    # reads jsonData.database. Both are set for backward/forward compatibility.
    database: $MES_PG_DB
    user: $MES_PG_USER
    isDefault: true
    jsonData:
      database: $MES_PG_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: $MES_PG_PASSWORD
    editable: false

  # ── Time-series telemetry (IIoT / energy / process) ────────────
  - name: MES360° InfluxDB
    uid: mes_influxdb
    type: influxdb
    access: proxy
    url: $MES_INFLUX_URL
    jsonData:
      version: Flux
      organization: $MES_INFLUX_ORG
      defaultBucket: $MES_INFLUX_BUCKET
      tlsSkipVerify: true
    secureJsonData:
      token: $MES_INFLUX_TOKEN
    editable: false

  # ── Infrastructure / service metrics ───────────────────────────
  - name: MES360° Prometheus
    uid: mes_prometheus
    type: prometheus
    access: proxy
    url: $MES_PROM_URL
    jsonData:
      httpMethod: POST
      timeInterval: 15s
    editable: false
