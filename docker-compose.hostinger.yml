# ============================================================
# MES360° — Hostinger VPS + Traefik (Docker Manager) compose
# ------------------------------------------------------------
# Same app as docker-compose.prod.yml, but:
#   • NO nginx service and NO host ports 80/443 (Traefik owns them).
#   • `api` + `web` join the shared external `traefik-proxy` network
#     and carry Traefik labels so Traefik routes traffic to them.
#   • One domain serves everything (same-origin):
#       https://APP_DOMAIN/            -> web   (Next.js, port 4000)
#       https://APP_DOMAIN/api/...     -> api   (NestJS, port 3001)
#       https://APP_DOMAIN/socket.io/  -> api   (WebSocket)
#
# Prereqs:
#   1. Deploy the Traefik project template once in Docker Manager.
#   2. Confirm the shared network name (default below: traefik-proxy):
#        docker network ls | grep -i traefik
#      If it differs, change `traefik-proxy` everywhere in this file.
#   3. Point an A record  APP_DOMAIN -> your VPS IP  in DNS.
#   4. Set the env vars: cp .env.hostinger.example .env.hostinger && edit it.
#
# Deploy:   docker compose -f docker-compose.hostinger.yml --env-file .env.hostinger up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: mes-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mes360}
      POSTGRES_USER: ${POSTGRES_USER:-mes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # Published for off-site Edge Gateways (plant PCs) that connect DIRECTLY over
    # TCP — Traefik only fronts HTTP(S), so these raw ports must be exposed.
    # ⚠ SECURITY: lock the VPS firewall so 5433 is reachable ONLY from the plant's
    # static IP(s), and keep a strong POSTGRES_PASSWORD.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mes_user} -d ${POSTGRES_DB:-mes360}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mes-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - mes-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    container_name: mes-influxdb-prod
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-mes360}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-mes_timeseries}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    # Published for off-site Edge Gateways (historian writes). ⚠ Firewall to the
    # plant IP(s); the INFLUX_TOKEN is the only credential here.
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - mes-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mes-mqtt-prod
    restart: always
    # Published for off-site Edge Gateways (tag/count/energy publishes). ⚠ Firewall
    # to the plant IP(s); enable auth in mosquitto.conf before exposing publicly.
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - mes-network

  minio:
    image: minio/minio:latest
    container_name: mes-minio-prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - mes-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # One-shot DB init: push the Prisma schema + seed initial data (admin users,
  # roles, reference data). Runs once and exits; the api waits for it to finish.
  migrate-seed:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    image: mes360-api:hostinger
    container_name: mes-migrate-seed-prod
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mes_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mes360}?schema=public
    networks:
      - mes-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "node node_modules/.bin/prisma db push --skip-generate --accept-data-loss &&
             node prisma/prod-init.js"

  api:
    # Built locally on the VPS from source (the prebuilt Hub image does not exist).
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    image: mes360-api:hostinger
    container_name: mes-api-prod
    restart: always
    environment:
      NODE_ENV: production
      # Plant timezone — so server-side date logic (shift windows, getHours(),
      # working-day calendar) runs in Riyadh local time instead of UTC. Without this
      # the api container defaults to UTC and every HH:mm shift boundary is off by +3h.
      TZ: Asia/Riyadh
      # Read OEE/KPI/output from the persisted ProductionSnapshot fact store (the
      # canonical, dimension-classified source) — matches prod-local + Grafana.
      SNAPSHOTS_READ: "on"
      API_PORT: "3001"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-mes_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mes360}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-mes360}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-mes_timeseries}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      # Grafana embedding for the Dashboard Center. Server-side calls use the internal
      # service; the iframe (kiosk) URL is the public domain served under /grafana.
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: https://${APP_DOMAIN}/grafana
      GRAFANA_DEFAULT_ORG_ID: "1"
      GRAFANA_FACTORY_VAR: factory
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: mes360
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_EXPIRES_IN: 30d
      # Same-origin in the browser means CORS is not strictly needed, but set the
      # real domain so any cross-origin tooling is accepted.
      CORS_ORIGINS: https://${APP_DOMAIN}
      UPLOAD_DIR: /app/uploads
    # Schema + seed are handled by migrate-seed; the api just runs the server.
    command: node dist/main.js
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully
    networks:
      - mes-network
    labels:
      - traefik.enable=true
      # API + WebSocket on the same domain, HIGHER priority so it wins over the
      # web catch-all for /api/* and /socket.io/*.
      - traefik.http.routers.mes-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.mes-api.entrypoints=websecure
      - traefik.http.routers.mes-api.tls.certresolver=letsencrypt
      - traefik.http.routers.mes-api.priority=100
      - traefik.http.services.mes-api.loadbalancer.server.port=3001
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M

  web:
    # Built locally on the VPS from source. NEXT_PUBLIC_* are baked at build time;
    # the browser still uses same-origin, so these mainly affect SSR fetches.
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${APP_DOMAIN}
    image: mes360-web:hostinger
    container_name: mes-web-prod
    restart: always
    environment:
      NODE_ENV: production
      # Next standalone server.js honours PORT; Traefik routes to this port.
      PORT: "4000"
      HOSTNAME: "0.0.0.0"
      # Browser uses same-origin (relative /api/v1) so these only affect SSR fetches.
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://${APP_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    depends_on:
      - api
    networks:
      - mes-network
    labels:
      - traefik.enable=true
      # Frontend catch-all for the domain (LOWER priority than the api router).
      # Hostinger's Traefik already does a global HTTP->HTTPS redirect, so only
      # the websecure (443) router is needed here.
      - traefik.http.routers.mes-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.mes-web.entrypoints=websecure
      - traefik.http.routers.mes-web.tls.certresolver=letsencrypt
      - traefik.http.routers.mes-web.priority=1
      - traefik.http.services.mes-web.loadbalancer.server.port=4000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Grafana dashboard suite — embedded in the MES360° Dashboard Center.
  # Served same-origin under https://APP_DOMAIN/grafana via Traefik (serve_from_sub_path),
  # so the embedded iframe shares the app domain (no CORS / third-party-cookie issues).
  grafana:
    image: grafana/grafana:latest
    container_name: mes-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Served under a sub-path behind Traefik.
      GF_SERVER_ROOT_URL: https://${APP_DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Embedding inside the MES360° Dashboard Center + anonymous read-only viewer.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5s"
      GF_PLUGINS_PREINSTALL: "redis-datasource,marcusolsson-treemap-panel"
      # Datasource connection (consumed by provisioning/datasources/datasources.yaml).
      MES_PG_HOST: postgres
      MES_PG_PORT: "5432"
      MES_PG_DB: ${POSTGRES_DB:-mes360}
      MES_PG_USER: ${POSTGRES_USER:-mes_user}
      MES_PG_PASSWORD: ${POSTGRES_PASSWORD}
      MES_INFLUX_URL: http://influxdb:8086
      MES_INFLUX_ORG: ${INFLUX_ORG:-mes360}
      MES_INFLUX_BUCKET: ${INFLUX_BUCKET:-mes_timeseries}
      MES_INFLUX_TOKEN: ${INFLUX_TOKEN}
      # No Prometheus service on Hostinger; the datasource is provisioned but unused
      # (MQTT monitoring is driven from Postgres/InfluxDB instead).
      MES_PROM_URL: http://prometheus:9090
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - mes-network
    labels:
      - traefik.enable=true
      # Grafana under /grafana — priority between api (100) and web (1).
      - traefik.http.routers.mes-grafana.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.mes-grafana.entrypoints=websecure
      - traefik.http.routers.mes-grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.mes-grafana.priority=50
      - traefik.http.services.mes-grafana.loadbalancer.server.port=3000

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  influxdb_data:
    driver: local
  minio_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  uploads-data:
    driver: local
  grafana_data:
    driver: local

networks:
  # Single bridge network for the whole stack. Hostinger's Traefik runs in
  # host-network mode and reaches these containers by their bridge IP via the
  # Docker provider — no shared/external network is needed.
  mes-network:
    driver: bridge
